# ============================================================
# เวอร์ชันทดสอบในเครื่อง - Tapo C246D
# ============================================================
# ใช้พิสูจน์ว่าทั้งเส้นทางทำงาน ก่อนจะไปตั้งเครื่องถาวร
# ปิด HTTPS ไว้ จึงไม่ต้องมีโดเมนและใบรับรอง เปิดดูได้ทันที
#
# ⛔ ห้ามเอาไฟล์นี้ไปใช้จริง ให้ใช้ cctv/mediamtx.yml แทน
#    เพราะไฟล์นี้ส่งภาพแบบไม่เข้ารหัส และหน้าเว็บบน GitHub Pages
#    ซึ่งเป็น https จะบล็อกสตรีม http ทิ้งอยู่ดี
#
# วิธีใช้
#   1. โหลด MediaMTX จาก https://github.com/bluenviron/mediamtx/releases
#      เลือกไฟล์ที่ลงท้าย windows_amd64.zip แล้วแตกไฟล์
#   2. เอาไฟล์นี้ไปวางทับ mediamtx.yml ที่มากับโปรแกรม
#   3. แก้ 2 บรรทัดล่างสุด ใส่ชื่อผู้ใช้กับรหัสบัญชีกล้อง
#   4. ดับเบิลคลิก mediamtx.exe
#   5. ทดสอบใน VLC: http://localhost:8888/cam1_wide/index.m3u8
# ============================================================

rtsp: no
rtmp: no
srt: no
api: no
metrics: no
pprof: no
playback: no

logLevel: info

hls: yes
hlsAddress: :8888
hlsVariant: lowLatency
hlsAlwaysRemux: no
hlsEncryption: no          # ปิดไว้เฉพาะตอนทดสอบ ของจริงต้องเปิด

webrtc: yes
webrtcAddress: :8889
webrtcEncryption: no       # ปิดไว้เฉพาะตอนทดสอบ

# เปิดให้เฉพาะเครื่องตัวเองกับวง LAN ของหน่วย
authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips:
      - 127.0.0.1
      - ::1                     # localhost บน Windows แปลงเป็น IPv6 ตัวนี้ ไม่ใส่จะขึ้น authentication error
      - 192.168.1.0/24
    permissions:
      - action: read

# ============================================================
# กล้องตัวแรก - IP 192.168.1.153 ตามที่ตั้งไว้ในแอป
# ============================================================
# ใช้สตรีมคุณภาพต่ำเหมือนที่จะใช้จริง จะได้เห็นภาพแบบเดียวกับที่ประชาชนเห็น
# อยากดูภาพชัดตอนทดสอบ เปลี่ยน stream2 เป็น stream1 และ stream7 เป็น stream6
paths:

  cam1_wide:
    source: rtsp://ชื่อผู้ใช้:รหัสผ่าน@192.168.1.153:554/stream2
    rtspTransport: tcp        # ดึงผ่าน TCP ไม่ใช่ UDP ที่เป็นค่าเริ่มต้น เพราะ UDP ทำแพ็กเก็ตหายจนภาพ H264 แตก
    sourceOnDemand: yes

  cam1_zoom:
    source: rtsp://ชื่อผู้ใช้:รหัสผ่าน@192.168.1.153:554/stream7
    rtspTransport: tcp        # ดึงผ่าน TCP ไม่ใช่ UDP ที่เป็นค่าเริ่มต้น เพราะ UDP ทำแพ็กเก็ตหายจนภาพ H264 แตก
    sourceOnDemand: yes
