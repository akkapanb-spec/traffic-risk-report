# ============================================================
# เกตเวย์กล้อง — แบบเปิดให้ดูจากนอกหน่วยผ่าน tunnel
# ============================================================
# ใช้ไฟล์นี้แทน mediamtx.yml เมื่อจะให้เจ้าหน้าที่ดูจากมือถือนอกวงแลน
#
# ต่างจาก mediamtx.yml เดิม 2 จุดเท่านั้น
#   1. เลิกกั้นด้วยเลข IP  ->  ไปกั้นด้วยการล็อกอินของระบบเจ้าหน้าที่แทน
#   2. เลิกใช้ https ที่ตัวเอง  ->  ให้ tunnel เป็นคนถือใบรับรอง
#
# ทำไมต้องเลิกกั้นด้วย IP
#   พอวิ่งผ่าน tunnel ทุกคำขอจะมาจากที่อยู่เดียวกันหมด คือตัว tunnel เอง
#   การกั้นด้วย IP จึงกลายเป็นทั้งปล่อยทุกคนและปฏิเสธทุกคนพร้อมกัน ใช้ตัดสินอะไรไม่ได้
#
# ⚠️ ห้ามใช้ไฟล์นี้โดยยังไม่ได้ deploy ตัวตรวจสิทธิ์ cam-auth
#    ระหว่างนั้นกล้องจะเปิดให้ใครก็ได้ที่รู้ลิงก์ดู
# ============================================================

rtsp: no
rtmp: no
srt: no
api: no
metrics: no
pprof: no
playback: no

logLevel: info

# ------------------------------------------------------------
# HLS
# ------------------------------------------------------------
hls: yes
hlsAddress: 127.0.0.1:8888     # ฟังเฉพาะในเครื่อง ทางเข้าเดียวคือผ่าน tunnel
hlsVariant: lowLatency
hlsAlwaysRemux: no

# ไม่ต้องเข้ารหัสที่ตัวเอง เพราะ tunnel เป็นคนถือใบรับรองและเข้ารหัสให้แล้ว
# ใส่ซ้ำจะกลายเป็นเข้ารหัสสองชั้นโดยไม่ได้ประโยชน์ และตั้งค่ายากขึ้นเปล่า ๆ
hlsEncryption: no

webrtc: no                      # ปิดไว้ก่อน ให้เหลือทางเข้าน้อยที่สุดเท่าที่จำเป็น

# ------------------------------------------------------------
# ใครดูได้บ้าง — ถามระบบเจ้าหน้าที่ทุกครั้ง
# ------------------------------------------------------------
# MediaMTX จะยิงคำถามไปที่ URL นี้ทุกครั้งที่มีคนขอไฟล์
# ทั้งไฟล์รายการและทุกชิ้นส่วนวิดีโอ ตอบ 200 = ให้ดู ตอบอย่างอื่น = ปฏิเสธ
#
# ปลายทางคือ Edge Function ที่เอา token ไปถาม officer_session_user
# ซึ่งเป็นตัวเดียวกับที่ระบบเจ้าหน้าที่ใช้ตรวจสิทธิ์ทุกหน้าอยู่แล้ว
# สิทธิ์ดูกล้องจึงผูกกับการล็อกอินเดิม ไม่มีรหัสผ่านชุดใหม่ให้ต้องจำหรือหลุด
authMethod: http
authHTTPAddress: https://ftpruljwwsmvipfcedyk.supabase.co/functions/v1/cam-auth

# ส่ง query string ต่อไปให้ตัวตรวจด้วย เพราะ token เดินทางมากับตรงนั้น
authHTTPExclude: []

# ------------------------------------------------------------
# รายการกล้อง
# ------------------------------------------------------------
# แก้ IP กับรหัสให้ตรงกับกล้องจริงก่อนใช้ — ดูวิธีใน cctv/README.md
paths:

  cam1_wide:
    source: rtsp://ชื่อผู้ใช้:รหัสผ่าน@192.168.1.168:554/stream2
    rtspTransport: tcp        # UDP ทำแพ็กเก็ตหายจนภาพ H264 แตก
    sourceOnDemand: yes

  cam1_zoom:
    source: rtsp://ชื่อผู้ใช้:รหัสผ่าน@192.168.1.168:554/stream7
    rtspTransport: tcp
    sourceOnDemand: yes
