# ============================================================
# เกตเวย์แปลงสัญญาณกล้องวงจรปิด สภ.เมืองนครสวรรค์
# ============================================================
# ไฟล์นี้ใช้กับ MediaMTX รุ่น 1.x  https://github.com/bluenviron/mediamtx
# วางไว้ข้าง ๆ ตัวโปรแกรม แล้วสั่งรัน โปรแกรมอ่านไฟล์ชื่อนี้เอง
#
# หน้าที่ของมัน: ดึง RTSP จากกล้อง แล้วปล่อยออกเป็น HLS กับ WebRTC
# ที่เบราว์เซอร์เล่นได้ เพราะเบราว์เซอร์เล่น RTSP เองไม่ได้
#
# อ่านคู่มือติดตั้งทีละขั้นที่ cctv/README.md
# ============================================================

# ------------------------------------------------------------
# ปิดทุกอย่างที่ไม่ได้ใช้
# ------------------------------------------------------------
# เปิดพอร์ตทิ้งไว้โดยไม่ได้ใช้คือเพิ่มช่องให้คนบุกเข้ามาเฉย ๆ
rtsp: no
rtmp: no
srt: no
api: no
metrics: no
pprof: no
playback: no

logLevel: info

# ------------------------------------------------------------
# HLS - ตัวหลักที่หน้าเว็บใช้
# ------------------------------------------------------------
hls: yes
hlsAddress: :8888
hlsVariant: lowLatency          # หน่วงราว 2-4 วินาที แทนที่จะเป็น 10-15
hlsAlwaysRemux: no              # no = ไม่มีคนดูก็ไม่ต้องแปลง ประหยัดทั้ง CPU และภาระกล้อง

# ต้องเปิด เพราะหน้าเว็บอยู่บน https ถ้าสตรีมเป็น http เบราว์เซอร์จะบล็อกทิ้งทั้งหมด
hlsEncryption: yes
hlsServerCert: server.crt
hlsServerKey: server.key

# ------------------------------------------------------------
# WebRTC - หน่วงต่ำกว่ามาก ไว้ใช้ตอนดูสด
# ------------------------------------------------------------
# HLS หน่วง 2-4 วินาที WebRTC หน่วงราว 1 วินาที
# ถ้าดูเพื่อสั่งการหน้างานให้ใช้ตัวนี้ ถ้าดูเฉย ๆ HLS เสถียรกว่า
webrtc: yes
webrtcAddress: :8889
webrtcEncryption: yes
webrtcServerCert: server.crt
webrtcServerKey: server.key

# ------------------------------------------------------------
# ใครดูได้บ้าง
# ------------------------------------------------------------
# ตั้งใจไม่ใส่รหัสผ่านสำหรับการดู เพราะหน้าเว็บของเราเป็นไฟล์เปิด
# ใครกด View Source ก็อ่านรหัสได้ ใส่ไปก็เท่ากับไม่ได้ใส่
#
# จึงคุมด้วยเลข IP แทน - เปิดให้เฉพาะวงเครือข่ายของหน่วย
# แก้ ips ด้านล่างให้ตรงกับวงจริงก่อนใช้งาน
authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips:
      - 127.0.0.1
      - ::1                     # localhost บน Windows แปลงเป็น IPv6 ตัวนี้ ไม่ใส่จะขึ้น authentication error
      - 192.168.1.0/24          # แก้เป็นวงของหน่วย
    permissions:
      - action: read

# ถ้าต้องให้ดูจากนอกหน่วยได้ อย่าเปิด ips เป็น 0.0.0.0/0
# ให้เปลี่ยนไปใช้ authMethod: http แล้วชี้ไปที่ตัวตรวจ session ของระบบเจ้าหน้าที่แทน
# วิธีนั้นเขียนไว้ท้าย cctv/README.md

# ------------------------------------------------------------
# รายการกล้อง
# ------------------------------------------------------------
# Tapo C246D เป็นกล้องสองเลนส์ จึงมี 4 สตรีมต่อกล้องหนึ่งตัว
#   stream1 = มุมกว้าง คุณภาพสูง      stream2 = มุมกว้าง คุณภาพต่ำ
#   stream6 = เทเลโฟโต้ คุณภาพสูง     stream7 = เทเลโฟโต้ คุณภาพต่ำ
#
# ที่เอา stream2 กับ stream7 ขึ้นเว็บ ไม่ใช่ตัวคุณภาพสูง
#   คนดูบนมือถือไม่ได้ต้องการ 6MP แต่ค่าเน็ตขาออกต่างกันหลายเท่า
#   ถ้าต้องการภาพชัดไว้ทำสำนวน ให้ตั้งกล้องบันทึกลง microSD แยกไว้
#
# sourceOnDemand: yes สำคัญมาก
#   กล้อง Tapo รับผู้ชมพร้อมกันได้ไม่กี่ราย ตัวนี้ทำให้ดึงจากกล้องเฉพาะตอนมีคนดูจริง
#   และดึงเส้นเดียวแล้วกระจายต่อ ต่อให้มีคนดู 100 คน กล้องก็เห็นผู้ชมแค่ 1 ราย
#
# วิธีเพิ่มกล้อง: ก็อปสี่บรรทัดของ cam1 มาแก้เลข แล้วแก้ IP กับรหัส
paths:

  cam1_wide:
    source: rtsp://ชื่อผู้ใช้:รหัสผ่าน@192.168.1.50:554/stream2
    sourceOnDemand: yes

  cam1_zoom:
    source: rtsp://ชื่อผู้ใช้:รหัสผ่าน@192.168.1.50:554/stream7
    sourceOnDemand: yes

  # ตัวอย่างกล้องที่สอง เอาเครื่องหมาย # ออกเมื่อติดตั้งจริง
  # cam2_wide:
  #   source: rtsp://ชื่อผู้ใช้:รหัสผ่าน@192.168.1.51:554/stream2
